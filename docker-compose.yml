# ============================================================
# DocuBrain API — Production Docker Compose
# ============================================================
# 3 containers only: app (Laravel + Reverb + Queue), postgres, redis
# ============================================================

name: docubrain

services:
  # ── PostgreSQL 16 + pgvector ─────────────────────────────
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: docubrain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-docubrain}
      POSTGRES_USER: ${DB_USERNAME:-docubrain}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-docubrain} -d ${DB_DATABASE:-docubrain}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docubrain

  # ── Redis 7 ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: docubrain-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docubrain

  # ── App (Laravel + Reverb + Queue via Supervisor) ────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docubrain-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
      - "${REVERB_SERVER_PORT:-8080}:8080"
    env_file: .env
    environment:
      # Override hosts to use Docker internal DNS
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_HOST: localhost
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    networks:
      - docubrain

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  docubrain:
    driver: bridge
