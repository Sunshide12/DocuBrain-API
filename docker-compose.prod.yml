name: docubrain

services:
  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL 18 + pgvector
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: docubrain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-docubrain}
      POSTGRES_USER: ${DB_USERNAME:-docubrain}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-docubrain} -d ${DB_DATABASE:-docubrain}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────
  # Redis 7 (alpine)
  # ─────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: docubrain-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────
  # Laravel 13 App — PHP 8.5
  # ─────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docubrain-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    working_dir: /var/www/html
    volumes:
    env_file: .env
    environment:
      # Hostnames internos de Docker (sobreescriben el .env)
      DB_HOST: postgres
      REDIS_HOST: redis
      REVERB_HOST: reverb
      # Activa composer install + migrate en el entrypoint
      RUN_SETUP: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────
  # Laravel Reverb (WebSockets)
  # ─────────────────────────────────────────────────────────────────────────
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docubrain-reverb
    restart: unless-stopped
    ports:
      - "${REVERB_SERVER_PORT:-8080}:8080"
    working_dir: /var/www/html
    volumes:
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────────
  # Laravel Queue Worker
  # ─────────────────────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docubrain-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3", "--timeout=300", "--max-time=3600"]
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
